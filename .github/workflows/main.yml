
      - name: Ativar AndroidX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$BUILD_DIR"

          touch "$BUILD_DIR/gradle.properties"

          if grep -q '^android\.useAndroidX=' "$BUILD_DIR/gradle.properties"; then
            sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' "$BUILD_DIR/gradle.properties"
          else
            echo 'android.useAndroidX=true' >> "$BUILD_DIR/gradle.properties"
          fi

          echo "Propriedade AndroidX configurada:"
          grep '^android\.useAndroidX=' "$BUILD_DIR/gradle.properties"
