
name: LexusVPN Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LexusVPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle.kts ]; then
            echo "BUILD_DIR=android" >> "$GITHUB_ENV"
          elif [ -f app/build.gradle.kts ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERRO: app/build.gradle.kts não encontrado."
            echo "Verifica a estrutura do projeto."
            exit 1
          fi

      - name: Preparar Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail

          VERSION=8.10.2
          URL="https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"

          curl -fL "$URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

          cd "$BUILD_DIR"

          mkdir -p gradle/wrapper

          /tmp/gradle-${VERSION}/bin/gradle wrapper \
            --gradle-version "$VERSION" \
            --distribution-type bin

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

          chmod +x gradlew

      - name: Verificar versão Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          ./gradlew --version

      - name: Verificar tarefas do projeto
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          ./gradlew tasks --no-daemon

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LexusVPN-debug-apk
          path: |
            android/**/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
