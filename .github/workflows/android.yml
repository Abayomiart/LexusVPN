
name: Compilar NEXUS VPN

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verificar estrutura do projeto
        run: |
          echo "Diretorio atual:"
          pwd
          echo "Ficheiros do projeto:"
          ls -la
          echo "Procurar Gradle Wrapper:"
          find . -maxdepth 4 -name gradlew -type f

      - name: Localizar Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          FILE="$(find . -maxdepth 4 -name gradlew -type f | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "ERRO: Gradle Wrapper gradlew nao encontrado."
            echo "Verifica se enviaste o projeto Android completo."
            exit 1
          fi

          DIR="$(dirname "$FILE")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$FILE"

          echo "Gradle Wrapper encontrado em: $FILE"

      - name: Verificar versao do Java
        run: java -version

      - name: Verificar versao do Gradle
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew --version

      - name: Compilar APK Debug
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK gerado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-VPN-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
